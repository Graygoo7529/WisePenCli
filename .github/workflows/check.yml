name: CLI checks
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run docs:contracts
      - run: npm run build:portable
      - run: npm run build:release
      - name: Check local portable package production dependencies and launchers
        run: node --test --test-name-pattern="真正启动链路|plaintext 登录|会话失效优先|MCP" tests/cli.test.mjs
        env:
          WISEPEN_TEST_PACKAGE: wisepen-cli
      - name: Check clean release package production dependencies and launchers
        run: node --test --test-name-pattern="真正启动链路|plaintext 登录|会话失效优先" tests/cli.test.mjs
        env:
          WISEPEN_TEST_PACKAGE: releases/wisepen-cli
      - name: Verify two OS users share login and tasks
        if: runner.os == 'Linux'
        run: sudo "$(command -v node)" scripts/verify-shared-directory.mjs
